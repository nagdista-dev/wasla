<html lang="en">
  <head>

    <link rel="icon" type="image/png" href="/favicon.png" sizes="16x16" />

    <meta name="mobile-web-app-capable" content="yes" />

    <title>Wasla</title>
    <script>try{var l=localStorage.getItem('wasla_language');var isAr=l==='ar';var appName=isAr?'واصـلة':'Wasla';document.documentElement.lang=isAr?'ar':'en';document.documentElement.dir=isAr?'rtl':'ltr';document.title=appName;var meta=document.querySelector('meta[property="og:title"]');if(meta)meta.setAttribute('content',appName);meta=document.querySelector('meta[name="apple-mobile-web-app-title"]');if(meta)meta.setAttribute('content',appName);meta=document.querySelector('meta[property="og:site_name"]');if(meta)meta.setAttribute('content',appName);document.documentElement.classList.toggle('dark',localStorage.getItem('wasla_theme')!=='light')}catch(e){}</script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
